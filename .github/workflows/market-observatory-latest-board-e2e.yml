name: Market Observatory Latest Board E2E

on:
  workflow_dispatch:
  pull_request:
    paths: ['market-observatory/latest-board-v1.js', 'market-observatory/metric-detail-v1.js', 'market-observatory/index.html', 'tests/observatory-tripod*.test.cjs', '.github/workflows/market-observatory-latest-board-e2e.yml']
  push:
    branches: [main]
    paths:
      - market-observatory/index.html
      - market-observatory/latest-board-v1.js
      - market-observatory/metric-detail-v1.js
      - tests/observatory-tripod-state.test.cjs
      - market-observatory/sector-etf-v1.js
      - market-observatory/data/observatory.json
      - market-observatory/data/sector-etf.json
      - market-observatory/data/economic-calendar.json
      - .github/workflows/market-observatory-latest-board-e2e.yml

permissions:
  contents: read

concurrency:
  group: market-observatory-latest-board-e2e
  cancel-in-progress: true

jobs:
  public-latest-board:
    runs-on: ubuntu-24.04  # Playwright Chromium unsupported on ubuntu-latest (26.04)
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and period-sign regression check
        run: |
          node --check market-observatory/latest-board-v1.js
          node --test tests/latest-board-period.test.cjs tests/observatory-tripod-next.test.cjs tests/observatory-bipod-weekly.test.cjs tests/observatory-metric-bipod-weekly.test.cjs tests/observatory-tripod-state.test.cjs
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve proposed source for pull requests
        if: github.event_name == 'pull_request'
        run: python3 -m http.server 8123 >/tmp/obs-tripod-http.log 2>&1 &
      - name: Verify public tab-scoped indicator boards
        env:
          URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8123/market-observatory/' || 'https://mauveplace.github.io/jjooni-control-tower/market-observatory/' }}
          LOCAL_QA: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const fs=require('node:fs');
          const expectedVersion=fs.readFileSync('market-observatory/latest-board-v1.js','utf8').match(/__JJOONI_LATEST_BOARD=\{version:'([^']+)'/)[1];
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const expected={
            rates:{title:'금리 주요 지표',must:['미국 2Y','미국 10Y','한국 10Y','일본 10Y','US 2s10s'],mustNot:['USD/KRW','WTI','KOSPI']},
            fx:{title:'환율 주요 지표',must:['USD/KRW','USD/JPY','JPY/KRW','DXY'],mustNot:['미국 10Y','WTI','KOSPI']},
            energy:{title:'원자재 주요 지표',must:['WTI','Brent','Natural Gas','Gold','Silver','Copper'],mustNot:['USD/KRW','미국 10Y','KOSPI']},
            sectors:{title:'섹터·ETF 주요 지표',must:['MA20 상회','1M RS 강세','1M RS 약세','성장-방어','SPY 1M','QQQ 1M'],mustNot:['USD/KRW','미국 10Y']},
            tripod:{title:'TRI-POD 주요 입력',must:['현재 상태','목표 노출','NASDAQ 100','MA250 · 계산 참고','VIX / VIX10','52주 고점대비'],mustNot:['USD/KRW','WTI']},
            calendar:{title:'경제일정 주요 지표',must:['오늘 일정','향후 7일','다음 일정','다음 ★★★'],mustNot:['USD/KRW','WTI','미국 10Y']}
          };
          async function snapshot(page){return page.evaluate(()=>({
            title:document.querySelector('#latestBoardTitle')?.textContent?.trim()||'',
            labels:[...document.querySelectorAll('#latestBoardGrid .latestTileTop b')].map(e=>e.textContent.trim()),
            values:[...document.querySelectorAll('#latestBoardGrid .latestTile strong')].map(e=>e.textContent.trim()),
            width:document.documentElement.scrollWidth,inner:window.innerWidth,
            contract:window.__JJOONI_LATEST_BOARD?.contract||'',version:window.__JJOONI_LATEST_BOARD?.version||'',
            pulse:[...document.querySelectorAll('#pulse .chip')].map(e=>e.textContent.trim())
          }))}
          async function clickTab(page,tab,title){
            await page.locator(`#tabs button[data-tab="${tab}"]`).click();
            await page.waitForFunction(t=>document.querySelector('#latestBoardTitle')?.textContent?.trim()===t,title,{timeout:15000});
            await page.waitForTimeout(tab==='sectors'||tab==='calendar'?1200:250);
            return snapshot(page);
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            let passed=false,last='';
            for(let attempt=1;attempt<=(process.env.LOCAL_QA==='1'?1:20)&&!passed;attempt++){
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              try{
                await page.goto(process.env.URL+`?latest_board_e2e=${Date.now()}`,{waitUntil:'networkidle',timeout:120000});
                await page.waitForFunction(v=>window.__JJOONI_LATEST_BOARD?.version===v,expectedVersion,{timeout:15000});
                await page.waitForFunction(()=>document.querySelectorAll('#latestBoardGrid .latestTile').length>=21,{timeout:15000});
                let x=await snapshot(page);
                const overviewOrder=await page.locator('#latestBoardGrid [data-overview-group]').evaluateAll(xs=>xs.map(x=>x.dataset.overviewGroup));
                assert(JSON.stringify(overviewOrder)===JSON.stringify(['indices','tripod','macro','week']),`overview order ${overviewOrder}`);
                const firstIndices=await page.locator('#latestBoardGrid .latestGroup-indices .latestTileTop b').allTextContents();
                assert(JSON.stringify(firstIndices.slice(0,6))===JSON.stringify(['Russell 2000','Dow','S&P 500','NASDAQ 종합','NASDAQ 100','VIX']),`index order ${firstIndices}`);
                const us2y=await page.locator('#latestBoardGrid .latestGroup-macro .latestTile').filter({has:page.locator('.latestTileTop b',{hasText:'미국 2Y'})}).locator('strong').innerText();
                assert(/^\d+\.\d{2}%$/.test(us2y),`US2Y precision ${us2y}`);
                for(const k of ['KOSPI','KOSDAQ','S&P 500','NASDAQ 100','VIX','Fear & Greed','USD/KRW','미국 10Y','한국 10Y','WTI','Gold'])assert(x.labels.includes(k),`overview missing ${k}`);
                assert(x.title==='시장 한눈에 보기',`overview title ${x.title}`);
                assert(x.contract==='GROUPED_MARKET_BOARD_WITH_INDEX_TAB_PERIOD_COMPARISON_AND_SOURCE_BASIS',`contract ${x.contract}`);
                assert(x.version===expectedVersion,`version ${x.version}`);

                for(const [tab,cfg] of Object.entries(expected)){
                  x=await clickTab(page,tab,cfg.title);
                  for(const k of cfg.must)assert(x.labels.includes(k),`${tab} missing ${k}: ${x.labels.join(',')}`);
                  for(const k of cfg.mustNot)assert(!x.labels.includes(k),`${tab} leaked ${k}`);
                  assert(x.pulse.length>0,`${tab} pulse empty`);
                  if(tab==='tripod'){
                    const state=await page.evaluate(()=>window.__JJOONI_LATEST_BOARD.getTripodDisplay());
                    assert(state.available,'completed-session strategy snapshot unavailable');
                    for(const label of [state.primary.label,state.secondary.label])assert(x.labels.includes(label),'state transition missing '+label);
                    const dates=await page.locator('#latestBoardGrid .latestTile time').allTextContents();
                    assert(dates.every(d=>d===state.date),'mixed signal dates '+dates.join(','));
                    for(const width of [390,800,1363]){
                      await page.setViewportSize({width,height:960});
                      assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+3),'strategy overflow at '+width);
                      await page.screenshot({path:'tripod-state-'+width+'.png',fullPage:true});
                    }
                    await page.setViewportSize({width:390,height:844});
                  }
                  assert(x.width<=x.inner+3,`${tab} mobile overflow ${x.width}>${x.inner}`);
                }
                assert(errors.length===0,`page errors ${errors.join(' | ')}`);
                console.log('LATEST_BOARD_TAB_SCOPING_E2E=PASS');
                passed=true;
              }catch(e){last=String(e);console.log(`LATEST_BOARD_E2E_RETRY attempt=${attempt} ${last}`)}
              await page.close();
              if(!passed&&process.env.LOCAL_QA!=='1')await sleep(15000);
            }
            await browser.close();
            assert(passed,`public tab-scoped latest board verification failed: ${last}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS



      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tripod-state-responsive
          path: tripod-state-*.png
